[project]
name = "sueperman"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "sqlalchemy>=2.0,<3",
    "python-multipart>=0.0.20",
    "google-genai>=1,<3",
    "mcp>=1,<2",
    "sentry-sdk[fastapi]>=2,<3",
    "pypdf>=6,<7",
    "pillow>=12,<13",
]

[project.optional-dependencies]
team = [
    "adal-agent-sdk",
    "band-sdk==9.1.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25", "respx>=0.22", "ruff>=0.9", "mypy>=1.15"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.uv.sources]
adal-agent-sdk = { git = "https://github.com/SylphAI-Inc/adal-sdk.git", rev = "8fc658151e7ffebbe3fdd0b915dc01dbe2ee44be" }
